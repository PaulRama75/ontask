<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — FER Onboarding</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #f8f8f8;
        color: #111;
        text-align: center;
        padding: 24px;
      }
      img {
        width: 96px;
        height: auto;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        color: #555;
        max-width: 420px;
        line-height: 1.5;
      }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        background: #111;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/logoblack.png" alt="FER" />
    <h1>You're offline</h1>
    <p>
      This page needs an internet connection. Check your network and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
