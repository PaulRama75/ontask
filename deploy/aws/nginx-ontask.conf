# nginx reverse proxy for the ontask Next.js app.
# Place at /etc/nginx/sites-available/ontask (Ubuntu) or
# /etc/nginx/conf.d/ontask.conf (Amazon Linux), then enable + reload nginx.
#
# This terminates HTTP on port 80 and proxies to `next start` on 127.0.0.1:3000.
# After you run Certbot (see DEPLOY.md) it will edit this file to add the
# TLS (443) server block and an HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;

    # Replace with your real domain (and www variant if used).
    server_name ontask.example.com;

    # Server Actions / document uploads can be large (next.config.ts allows
    # a 30mb body); let nginx pass bodies up to the same ceiling.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve the original host/scheme so Next.js builds correct URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / upgrade support (harmless if unused).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
